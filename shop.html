<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Collection | LilAura UK</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
    <link rel="stylesheet" href="styles.css?v=luxe">
</head>
<body>
    <div class="announce">Autumn Edit · <b>20% OFF</b> selected anti-tarnish jewellery · Ends in <span id="miniTimer">--:--:--</span></div>
    
    <div id="lilaura-header-mount"></div>

    <div class="page-header">
        <div class="eyebrow" style="color:var(--emerald); margin-bottom:15px">The LilAura Edit</div>
        <h1>The Collection</h1>
        <p style="font-family:'Proza Libre', sans-serif; font-size:14px; color:var(--muted); max-width:600px; margin:0 auto">Explore our curated selection of waterproof 18K gold plated pieces and authentic traditional Indian brass jewellery.</p>
    </div>

    <section class="section" style="padding-top:20px">
        <div class="tabs" style="justify-content:center; border-bottom:1px solid var(--line); padding-bottom:30px">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="kadas">Kadas & Bracelets</button>
            <button class="tab" data-filter="necklaces">Necklaces</button>
            <button class="tab" data-filter="traditional">Traditional</button>
            <button class="tab" data-filter="rings">Rings</button>
        </div>
        <div class="product-grid" id="shop-grid"></div>
    </section>

    <div class="overlay" id="overlay"></div>
    <div class="toast" id="toast"></div>

    <div id="lilaura-footer-mount"></div>
<script src="components.js"></script>
<script src="script.js?v=luxe"></script>
</body>
</html>
