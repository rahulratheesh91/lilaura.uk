backend:
  name: github
  repo: rahulratheesh91/lilaura.uk
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "store_data"
    label: "Store Catalog & Settings"
    files:
      - name: "catalog"
        label: "Store Data (products.json)"
        file: "products.json"
        fields:
          # 1. Promo Banner Config
          - name: "promoConfig"
            label: "Promo Banner Config"
            widget: "object"
            required: false
            fields:
              - { label: "Announcement Text", name: "text", widget: "string", required: false }
              - { label: "Promo End Date & Time", name: "endTime", widget: "datetime", required: false }
          
          # 2. Product Categories
          - name: "categories"
            label: "Product Categories"
            widget: "list"
            collapsed: true
            required: false
            summary: '{{fields.title}}'
            fields:
              - { label: "Main Line", name: "mainLine", widget: "string", required: false, hint: "e.g., anti-tarnish, traditional, all" }
              - { label: "Sub-Category Key", name: "subCategory", widget: "string", required: false, hint: "e.g., necklaces, kadas, earrings, rings, all" }
              - { label: "Display Title", name: "title", widget: "string", required: false, hint: "e.g. Kadas & Cuffs" }

          # 3. Product Items List
          - name: "items"
            label: "Products"
            widget: "list"
            collapsed: true
            minimize_collapsed: true
            summary: '{{fields.name}} - £{{fields.price}}'
            fields:
              - { label: "Product ID", name: "id", widget: "string", required: false, hint: "Unique product identifier, e.g. la-01" }
              - { label: "Product Name", name: "name", widget: "string", required: false }
              - { label: "Price (£)", name: "price", widget: "number", value_type: "float", required: false }
              - { label: "In Stock?", name: "inStock", widget: "boolean", default: true, required: false }
              - { label: "Main Collection Line", name: "mainLine", widget: "select", options: ["anti-tarnish", "traditional"], required: false }
              - { label: "Sub-Category", name: "subCategory", widget: "select", options: ["necklaces", "kadas", "earrings", "rings"], required: false }
              - { label: "Primary Image URL", name: "image", widget: "string", required: false, hint: "Public HTTPS image URL" }
              - { label: "Hover Image / Video URL", name: "imageHover", widget: "string", required: false }
              - { label: "Etsy Listing URL", name: "etsyLink", widget: "string", required: false }
              - { label: "Featured on Homepage? (Max 4)", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Bestseller Tag", name: "bestseller", widget: "boolean", default: false, required: false }
              - { label: "New Arrival Tag", name: "newArrival", widget: "boolean", default: false, required: false }
              - { label: "Description", name: "desc", widget: "text", required: false }
