backend:
  name: github
  repo: rahulratheesh91/lilaura.uk
  branch: main
  auth_type: token

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product ID", name: "id", widget: "string", hint: "Unique product identifier, e.g. la-01" }
      - { label: "Product Name", name: "name", widget: "string" }
      - { label: "Price (£)", name: "price", widget: "number", value_type: "float" }
      - { label: "Main Collection Line", name: "mainLine", widget: "select", options: [{label: "Anti-Tarnish Everyday Luxury", value: "anti-tarnish"}, {label: "Traditional Heritage", value: "traditional"}] }
      - { label: "Sub-Category", name: "subCategory", widget: "select", options: [{label: "Necklaces", value: "necklaces"}, {label: "Kada's & Cuffs", value: "kadas"}, {label: "Earrings", value: "earrings"}, {label: "Finger Rings", value: "rings"}] }
      - { label: "Primary Image URL", name: "image", widget: "string", hint: "Public HTTPS image URL" }
      - { label: "Hover Image / Video URL", name: "imageHover", widget: "string", required: false }
      - { label: "Etsy Listing URL", name: "etsyLink", widget: "string" }
      - { label: "Featured on Homepage? (Max 4)", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Bestseller Tag", name: "bestseller", widget: "boolean", default: false, required: false }
      - { label: "New Arrival Tag", name: "newArrival", widget: "boolean", default: false, required: false }
      - { label: "Description", name: "desc", widget: "text", required: false }

  - name: "settings"
    label: "Store Settings"
    files:
      - name: "promo"
        label: "Promo Banner Config"
        file: "content/settings/promo.json"
        fields:
          - { label: "Announcement Text", name: "text", widget: "string", default: "Autumn Edit · 20% OFF selected anti-tarnish jewellery" }
          - { label: "Promo End Date & Time", name: "endTime", widget: "datetime" }
