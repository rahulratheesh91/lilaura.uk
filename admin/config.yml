backend:
  name: github
  repo: rahulratheesh91/lilaura.uk
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "store_data"
    label: "Store Catalog & Settings"
    files:
      - name: "catalog"
        label: "Store Data (products.json)"
        file: "products.json"
        fields:
          # 1. Promo Banner Config
          - name: "promoConfig"
            label: "Promo Banner Config"
            widget: "object"
            required: false
            fields:
              - { label: "Enable Promo Banner?", name: "enabled", widget: "boolean", default: false, required: false }
              - { label: "Promo Title", name: "title", widget: "string", required: false, hint: "e.g. Navaratri 2026" }
              - { label: "Discount Text", name: "discountText", widget: "string", required: false, hint: "e.g. 20% OFF on all LilAura traditional jewellery on ETSY checkout" }
              - { label: "Promo End Date & Time", name: "endTime", widget: "datetime", required: false }

          # 2. Product Categories
          - name: "categories"
            label: "Product Categories"
            widget: "list"
            collapsed: true
            required: false
            summary: '{{fields.title}}'
            fields:
              - { label: "Category ID", name: "id", widget: "string", required: false, hint: "e.g. all, kadas, necklaces, traditional, earrings, rings" }
              - { label: "Display Title", name: "title", widget: "string", required: false, hint: "e.g. Kadas & Cuffs" }

          # 3. Product Items List
          - name: "items"
            label: "Products"
            widget: "list"
            collapsed: true
            minimize_collapsed: true
            summary: '[#{{fields.id}}] {{fields.name}}'
            fields:
              - { label: "Product ID (Auto-Generated)", name: "id", widget: "auto_id", required: false, hint: "Auto-incremented & locked — use this number in your SKU" }
              - { label: "SKU", name: "sku", widget: "string", required: false, hint: "Stock Keeping Unit, e.g. TRNK-PN-49" }
              - { label: "Product Name", name: "name", widget: "string", required: false }
              - { label: "Price (£) (Internal Reference)", name: "price", widget: "number", value_type: "float", required: false, hint: "Hidden on storefront; optional" }
              - { label: "In Stock?", name: "inStock", widget: "boolean", default: true, required: false }
              - { label: "Main Collection Line", name: "mainLine", widget: "select", options: ["anti-tarnish", "traditional"], required: false }
              - { label: "Sub-Category", name: "subCategory", widget: "select", options: ["necklaces", "kadas", "earrings", "rings"], required: false }
              - { label: "Category (Internal)", name: "category", widget: "string", required: false }
              - { label: "Primary Image URL", name: "image", widget: "string", required: false, hint: "Public HTTPS image URL or /images/uploads/ path" }
              - { label: "Hover Image / Video URL", name: "imageHover", widget: "string", required: false }
              - { label: "Etsy Listing URL", name: "etsyLink", widget: "string", required: false }
              - { label: "Featured on Homepage? (Max 4)", name: "featured", widget: "boolean", default: false, required: false }
              - { label: "Bestseller Tag", name: "bestseller", widget: "boolean", default: false, required: false }
              - { label: "New Arrival Tag", name: "newArrival", widget: "boolean", default: false, required: false }
              - { label: "Description", name: "desc", widget: "text", required: false }
              - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
              - { label: "Meta Description", name: "metaDesc", widget: "text", required: false }
