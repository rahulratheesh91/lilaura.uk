<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LilAura Admin Panel</title>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
  <style>
    #token-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 58, 42, 0.8);
      backdrop-filter: blur(4px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .modal-box {
      background: #ffffff;
      padding: 36px;
      border-radius: 8px;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
    }
    .modal-box h3 { margin: 0 0 12px 0; color: #1a1a1a; font-size: 22px; font-family: serif; }
    .modal-box p { font-size: 13.5px; color: #666; line-height: 1.6; margin-bottom: 20px; }
    .modal-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 16px;
      box-sizing: border-box;
      font-size: 14px;
      font-family: monospace;
    }
    .modal-box button {
      background: #023A2A;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    .modal-box button:hover { background: #034d37; }
  </style>
</head>
<body>
  <div id="token-modal">
    <div class="modal-box">
      <h3>LilAura Admin Access</h3>
      <p>Enter your GitHub Personal Access Token (Classic token with <code>repo</code> scope) to securely manage your store catalogue.</p>
      <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <button onclick="saveToken()">Authenticate & Enter</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'decap-cms-user';
    const legacyKey = 'netlify-cms-user';
    let userSession = null;
    try {
      userSession = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(legacyKey);
    } catch (e) {
      userSession = null;
    }

    if (!userSession) {
      document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('token-modal');
        if (modal) modal.style.display = 'flex';
      });
    }

    function saveToken() {
      const token = document.getElementById('pat-input').value.trim();
      if (!token) {
        alert('Please paste a valid GitHub personal access token.');
        return;
      }
      const authData = {
        token: token,
        backendName: 'github',
        user: { name: 'Rahul Ratheesh', login: 'rahulratheesh91' }
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(authData));
        localStorage.setItem(legacyKey, JSON.stringify(authData));
      } catch (e) {
        console.error("Storage error:", e);
      }
      window.location.reload();
    }
  </script>

  <!-- Decap CMS Core Engine -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- LILAURA APEX X™: Initialize CMS with direct GitHub Token Backend -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.CMS) {
        CMS.init({
          config: {
            backend: {
              name: 'github',
              repo: 'rahulratheesh91/lilaura.uk',
              branch: 'main',
              auth_type: 'token'
            }
          }
        });
      }
    });
  </script>
</body>
</html>
