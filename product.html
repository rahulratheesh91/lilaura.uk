<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Lilaura</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lilaura: {
                            cream: '#F2F0E9',
                            gold: '#D4AF37',
                            goldhover: '#B5952F',
                            emerald: '#034938',
                            text: '#2C2C2C',
                            subtle: '#6B6B6B'
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['"Proza Libre"', 'sans-serif'],
                    },
                    letterSpacing: {
                        'widest-luxury': '0.2em',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
    <style>
        .show-fomo { opacity: 1 !important; transform: translateY(0) !important; pointer-events: auto !important; visibility: visible !important; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-lilaura-cream text-lilaura-text antialiased">

    <nav class="fixed w-full z-50 transition-all duration-300 bg-lilaura-cream/95 backdrop-blur-md border-b border-lilaura-gold/20">
        <div class="flex justify-between items-center py-5 px-6 md:px-16">
            <a href="index.html" class="font-serif text-3xl font-semibold tracking-wide text-lilaura-emerald hover:text-lilaura-gold transition-colors duration-300">LILAURA</a>
            
            <div class="hidden md:flex space-x-10 font-sans text-xs tracking-widest uppercase font-medium">
                <a href="shop.html" class="text-lilaura-emerald hover:text-lilaura-gold transition flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                    Back to Collection
                </a>
            </div>

            <div class="cursor-pointer relative group" onclick="checkoutWhatsApp()">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-lilaura-text group-hover:text-lilaura-gold transition">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>
                <span class="cart-count absolute -top-2 -right-2 bg-lilaura-emerald text-white text-[9px] w-4 h-4 flex items-center justify-center rounded-full font-sans">0</span>
            </div>
        </div>
    </nav>

    <div id="product-detail-container" class="max-w-7xl mx-auto px-6 md:px-16 pt-32 pb-24 grid grid-cols-1 md:grid-cols-2 gap-12 md:gap-24 animate-fade-in">
        
        <div class="w-full relative">
            <div class="sticky top-32 aspect-square bg-gray-100 overflow-hidden shadow-sm border border-lilaura-gold/10">
                <img id="p-image" src="" alt="Lilaura Jewellery" class="w-full h-full object-cover hover:scale-105 transition-transform duration-700">
            </div>
        </div>

        <div class="flex flex-col justify-center">
            <div class="flex justify-between items-start border-b border-lilaura-gold/20 pb-4 mb-6">
                <span id="p-cat" class="text-[10px] tracking-[0.25em] uppercase text-lilaura-emerald font-medium">Category</span>
                <span id="p-sku" class="text-[10px] tracking-widest text-gray-400">SKU: ---</span>
            </div>
            
            <h1 id="p-name" class="font-serif text-4xl md:text-6xl text-lilaura-text mb-6 leading-tight">Product Name</h1>
            <p id="p-price" class="font-serif text-3xl text-lilaura-gold mb-8">£0.00</p>
            
            <p id="p-desc" class="font-sans text-lilaura-subtle leading-loose text-sm md:text-base mb-10">
                Description loading...
            </p>

            <div class="flex flex-col gap-4">
                <button id="add-to-cart-btn" class="w-full bg-lilaura-emerald hover:bg-lilaura-text text-white font-sans text-xs uppercase tracking-[0.2em] py-5 transition duration-300 shadow-lg hover:shadow-xl">
                    Add to Cart
                </button>
                <a id="p-insta" href="https://instagram.com/lilaura.uk" target="_blank" class="w-full border border-lilaura-gold text-lilaura-gold hover:bg-lilaura-gold hover:text-white text-center font-sans text-xs uppercase tracking-[0.2em] py-5 transition duration-300">
                    View on Instagram
                </a>
            </div>
            
            <div class="mt-12 pt-8 border-t border-lilaura-gold/10 grid grid-cols-3 gap-4 text-center">
                <div>
                    <div class="w-8 h-8 mx-auto mb-2 text-lilaura-gold">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                    <p class="font-sans text-[9px] uppercase tracking-widest text-lilaura-subtle">Anti-Tarnish</p>
                </div>
                <div>
                    <div class="w-8 h-8 mx-auto mb-2 text-lilaura-gold">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>
                    </div>
                    <p class="font-sans text-[9px] uppercase tracking-widest text-lilaura-subtle">Waterproof</p>
                </div>
                <div>
                    <div class="w-8 h-8 mx-auto mb-2 text-lilaura-gold">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" /></svg>
                    </div>
                    <p class="font-sans text-[9px] uppercase tracking-widest text-lilaura-subtle">Fast UK Ship</p>
                </div>
            </div>
        </div>
    </div>

    <button onclick="checkoutWhatsApp()" class="fixed bottom-8 right-8 z-50 bg-lilaura-emerald hover:bg-lilaura-gold text-white p-4 rounded-full shadow-2xl transition duration-300 flex items-center gap-2 group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span class="hidden group-hover:inline font-sans text-sm font-semibold pr-2">Checkout</span>
        <span class="cart-count bg-white text-lilaura-emerald text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center absolute -top-1 -right-1 shadow-sm">0</span>
    </button>
    
    <div id="fomo-popup" class="fixed bottom-24 left-8 z-50 bg-white border border-lilaura-gold/30 shadow-2xl p-4 flex items-center gap-4 transition-all duration-700 opacity-0 translate-y-8" style="pointer-events: none;">
        <div class="w-10 h-10 rounded-full bg-lilaura-cream flex items-center justify-center text-lilaura-gold border border-lilaura-gold/50 shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
            </svg>
        </div>
        <div>
            <p id="fomo-text" class="font-sans text-xs text-lilaura-subtle mb-0.5">Loading...</p>
            <p id="fomo-product" class="font-serif text-sm text-lilaura-text font-semibold line-clamp-1 max-w-[180px]">...</p>
            <p class="font-sans text-[9px] text-lilaura-emerald uppercase tracking-widest mt-1">Just now</p>
        </div>
        <button onclick="document.getElementById('fomo-popup').classList.remove('show-fomo')" class="absolute top-2 right-2 text-gray-400 hover:text-gray-800 leading-none text-lg">&times;</button>
    </div>

    <footer class="bg-lilaura-text text-lilaura-cream py-12 border-t border-lilaura-gold/20">
        <div class="max-w-6xl mx-auto px-8 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="text-center md:text-left">
                <h3 class="font-serif text-2xl text-lilaura-gold mb-2">LILAURA</h3>
                <p class="font-sans text-xs text-gray-400 tracking-widest uppercase">Heritage / Modern / Eternal</p>
            </div>
            <div class="flex gap-6 font-sans text-xs uppercase tracking-widest text-gray-400">
                <a href="shop.html" class="hover:text-white transition">Shop</a>
                <a href="about.html" class="hover:text-white transition">Our Story</a>
                <a href="https://instagram.com/lilaura.uk" target="_blank" class="hover:text-white transition">Contact</a>
            </div>
            <div class="text-xs text-gray-500 font-sans">
                &copy; 2024 Lilaura UK. All Rights Reserved.
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
