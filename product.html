<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | LilAura</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <div class="nav-left"><a href="shop.html">← Back to Collection</a></div>
            <a class="logo" href="index.html">LILAURA<small>MODERN HERITAGE JEWELLERY</small></a>
            <div class="nav-right"><button class="cart" id="cartBtn">Bag <span class="bubble" id="cartCount">0</span></button></div>
        </nav>
    </header>

    <div class="product-detail-layout" id="product-detail-container" style="padding-top:80px">
        <div class="p-image-wrap">
            <img id="p-image" class="main-visual" src="" alt="Jewellery">
            <img id="p-image-hover" class="hover-visual" src="" alt="Model Wearing">
            <video id="p-video-hover" class="hover-visual" src="" style="display:none" autoplay loop muted playsinline></video>
        </div>

        <div class="p-info-wrap">
            <span id="p-cat" class="p-sku" style="color:var(--emerald)">Category</span>
            <span id="p-sku" class="p-sku">SKU</span>
            
            <h1 id="p-name" class="p-title">Product Name</h1>
            <div id="p-price" class="p-cost price">£0.00</div>
            <p id="p-desc" class="p-desc">Description loading...</p>

            <button id="buy-btn" class="checkout" style="font-size:12px; padding:20px; width:100%; margin-bottom:40px">Add to Bag</button>

            <!-- FAQs -->
            <div style="border-top:1px solid var(--line)">
                <div class="accordion">
                    <div class="accordion-title" id="faq-mat-title">Materials <span>+</span></div>
                    <div class="accordion-content" id="faq-mat-content">Loading...</div>
                </div>
                <div class="accordion">
                    <div class="accordion-title">Delivery & Returns <span>+</span></div>
                    <div class="accordion-content">UK Fast Dispatch. Secure checkout and buyer protection via our official Etsy integration.</div>
                </div>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <aside class="drawer" id="drawer"><div class="drawer-head"><h3>Your bag</h3><button class="close" id="closeDrawer">×</button></div><div id="cartItems"></div><div id="cartBottom"></div></aside>
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
